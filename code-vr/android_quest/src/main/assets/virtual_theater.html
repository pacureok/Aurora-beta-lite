<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aurora Lite - Teatro Virtual Inmersivo (WebXR / Meta Quest 3S)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #050508; color: #fffffe;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
    }
    /* HUD Flotante 3D Overlay */
    #theater-ui {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; align-items: center; gap: 12px;
      background: rgba(18, 18, 26, 0.82); backdrop-filter: blur(16px);
      border: 1px solid rgba(127, 90, 240, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(127, 90, 240, 0.2);
      border-radius: 40px; padding: 10px 24px; transition: all 0.3s ease;
    }
    #theater-ui:hover {
      border-color: rgba(127, 90, 240, 0.8);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 25px rgba(127, 90, 240, 0.4);
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.06); color: #fffffe; border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: all 0.2s ease;
    }
    .hud-btn:hover {
      background: #7f5af0; border-color: #7f5af0; transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(127, 90, 240, 0.4);
    }
    .hud-btn.active {
      background: #7f5af0; border-color: #9d7df8;
    }
    .hud-badge {
      background: #2cb67d; color: #010101; font-size: 10px; font-weight: 800;
      padding: 2px 6px; border-radius: 10px; text-transform: uppercase;
    }
    #vr-btn {
      background: linear-gradient(135deg, #7f5af0, #2cb67d);
      border: none; color: #ffffff; font-weight: bold;
    }
    #vr-btn:hover {
      background: linear-gradient(135deg, #9d7df8, #4de6a5);
      box-shadow: 0 0 20px rgba(44, 182, 125, 0.5);
    }
    #top-brand {
      position: absolute; top: 20px; left: 24px; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      background: rgba(18, 18, 26, 0.7); backdrop-filter: blur(12px);
      padding: 8px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px; font-weight: 600;
    }
    #top-brand .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #2cb67d;
      box-shadow: 0 0 8px #2cb67d;
    }
    /* Iframe de contenido web dentro de la pantalla virtual */
    #content-feed {
      display: none;
    }
    /* Notificación HUD no invasiva (Toast) */
    .vr-toast {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(22, 22, 34, 0.95);
      color: #fffffe;
      border: 1px solid #7f5af0;
      box-shadow: 0 8px 32px rgba(127, 90, 240, 0.35);
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .vr-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="top-brand">
    <span class="dot"></span>
    <span>Aurora Lite • Teatro Virtual Inmersivo</span>
    <span class="hud-badge" id="hz-indicator">90Hz WebXR</span>
  </div>

  <div id="canvas-container"></div>
  <div id="vr-toast" class="vr-toast"></div>

  <!-- HUD Flotante de Controles -->
  <div id="theater-ui">
    <button class="hud-btn" id="btn-curve" title="Alternar Curvatura de Pantalla">
      <span>📐 Curvatura: IMAX</span>
    </button>
    <button class="hud-btn" id="btn-distance" title="Ajustar Distancia">
      <span>📏 Distancia: Media</span>
    </button>
    <button class="hud-btn" id="btn-scale" title="Ajustar Tamaño de Pantalla">
      <span>📺 Pantalla: Gigante</span>
    </button>
    <button class="hud-btn" id="btn-lights" title="Iluminación Ambiental del Cine">
      <span>💡 Luces: Cine</span>
    </button>
    <button class="hud-btn" id="btn-url" title="Cambiar URL / Video">
      <span>🔗 Cambiar Video</span>
    </button>
    <button class="hud-btn" id="btn-steamlink" style="background: linear-gradient(135deg, #1b2838, #2a475e); border-color: #66c0f4;" title="Transmitir Pantalla o Juegos con Steam Link / Escritorio">
      <span>🎮 Steam Link / PC Stream</span>
    </button>
    <button class="hud-btn" id="btn-steamvr" style="background: linear-gradient(135deg, #171a21, #212c3d); border-color: #66c0f4;" title="Iniciar / Conectar con SteamVR">
      <span>🥽 SteamVR</span>
    </button>
    <button class="hud-btn" id="vr-btn" title="Iniciar WebXR para Meta Quest 3S / SteamVR">
      <span>🥽 Ingresar a VR</span>
    </button>
    <button class="hud-btn" id="btn-exit" style="background: rgba(239, 69, 101, 0.2); border-color: rgba(239, 69, 101, 0.4);" title="Salir del Teatro">
      <span>✕ Salir</span>
    </button>
  </div>

  <script>
    // Parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const mediaParam = urlParams.get('media') || 'https://www.youtube.com';
    const hzParam = urlParams.get('hz') || '90';
    document.getElementById('hz-indicator').textContent = `${hzParam}Hz WebXR`;

    // Inicialización Three.js
    let scene, camera, renderer, screenMesh, ambientLight, screenLight;
    let vrButton = document.getElementById('vr-btn');
    let isVRSupported = false;

    const container = document.getElementById('canvas-container');

    // Estado del Teatro
    const state = {
      curvatureIndex: 1, // 0: Plano, 1: IMAX (Curvado), 2: Envolvente 180°
      curvatures: [
        { label: 'Plana', radius: 45, arc: 0.7 },
        { label: 'IMAX', radius: 18, arc: 1.45 },
        { label: 'Envolvente', radius: 12, arc: 2.3 }
      ],
      distanceIndex: 1, // 0: Cerca, 1: Media, 2: Lejos
      distances: [
        { label: 'Cerca', z: -10 },
        { label: 'Media', z: -14 },
        { label: 'Fondo', z: -19 }
      ],
      scaleIndex: 1, // 0: Normal, 1: Gigante, 2: Ultra-Wide
      scales: [
        { label: 'Normal', sx: 1.0, sy: 1.0 },
        { label: 'Gigante', sx: 1.35, sy: 1.35 },
        { label: 'Ultra-Wide', sx: 1.7, sy: 1.1 }
      ],
      lightsIndex: 1, // 0: Apagadas, 1: Cine, 2: Ambiente
      lights: [
        { label: 'Apagadas', intensity: 0.05 },
        { label: 'Cine', intensity: 0.35 },
        { label: 'Ambiente', intensity: 0.85 }
      ]
    };

    function init() {
      // 1. Escena
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06070a);
      scene.fog = new THREE.FogExp2(0x06070a, 0.025);

      // 2. Cámara
      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0); // 1.6m altura promedio ojos humanos

      // 3. Renderer con WebXR habilitado
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.xr.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // 4. Iluminación
      ambientLight = new THREE.AmbientLight(0x1a1c29, state.lights[state.lightsIndex].intensity);
      scene.add(ambientLight);

      screenLight = new THREE.PointLight(0x7f5af0, 1.2, 35);
      screenLight.position.set(0, 3, -12);
      scene.add(screenLight);

      // 5. Entorno del Auditorio / Teatro
      crearAuditorio();

      // 6. Pantalla Gigante Curva
      crearPantallaCurva();

      // 7. Controles de Escritorio (Rotación con mouse / joystick)
      configurarControlesDesktop();

      // 8. Eventos de Redimensionamiento
      window.addEventListener('resize', onWindowResize);

    let toastTimeout = null;
    function mostrarToastHUD(mensaje) {
      const toast = document.getElementById('vr-toast');
      if (!toast) return;
      toast.textContent = mensaje;
      toast.classList.add('visible');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('visible');
      }, 4500);
    }

    // 9. Comprobar WebXR para visores (Meta Quest 3S)
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then(supported => {
        isVRSupported = supported;
        if (supported) {
          vrButton.innerHTML = '<span>🥽 Entrar a VR (Quest 3S)</span>';
        } else {
          vrButton.innerHTML = '<span>🥽 Modo 3D Escritorio</span>';
        }
      }).catch(() => {
        isVRSupported = false;
        vrButton.innerHTML = '<span>🥽 Modo 3D Escritorio</span>';
      });
    } else {
      isVRSupported = false;
      vrButton.innerHTML = '<span>🥽 Modo 3D Escritorio</span>';
    }

      // 10. Configurar Botones del HUD
      configurarBotonesHUD();

      // 11. Bucle de Renderizado
      renderer.setAnimationLoop(render);
    }

    function crearAuditorio() {
      // Piso del auditorio con sutil reflejo
      const floorGeo = new THREE.PlaneGeometry(80, 80);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x0a0b12,
        roughness: 0.4,
        metalness: 0.25
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      // Filas de asientos estilizados en gradas
      const rowCount = 5;
      for (let r = 0; r < rowCount; r++) {
        const zPos = 2 + r * 2.8;
        const yPos = r * 0.45;
        const seatRowGeo = new THREE.BoxGeometry(26, 0.45, 0.9);
        const seatMat = new THREE.MeshStandardMaterial({ color: 0x12131d, roughness: 0.8 });
        const rowMesh = new THREE.Mesh(seatRowGeo, seatMat);
        rowMesh.position.set(0, yPos, zPos);
        scene.add(rowMesh);
      }

      // Paredes oscuras del teatro
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x07080e, roughness: 0.9 });
      // Pared trasera
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 25), wallMat);
      backWall.position.set(0, 12.5, -28);
      scene.add(backWall);

      // Paneles acústicos con iluminación neón en los costados
      for (let side of [-1, 1]) {
        for (let i = 0; i < 5; i++) {
          const panelGeo = new THREE.BoxGeometry(0.3, 10, 2.5);
          const panelMat = new THREE.MeshStandardMaterial({ color: 0x161622, roughness: 0.7 });
          const panel = new THREE.Mesh(panelGeo, panelMat);
          panel.position.set(side * 18, 5, -5 - i * 4);
          scene.add(panel);

          const neonGeo = new THREE.BoxGeometry(0.05, 9.8, 0.1);
          const neonMat = new THREE.MeshBasicMaterial({ color: 0x7f5af0 });
          const neon = new THREE.Mesh(neonGeo, neonMat);
          neon.position.set(side * 17.8, 5, -5 - i * 4);
          scene.add(neon);
        }
      }
    }

    // Crea el lienzo de la pantalla curva
    function crearPantallaCurva() {
      if (screenMesh) scene.remove(screenMesh);

      const curConf = state.curvatures[state.curvatureIndex];
      const radius = curConf.radius;
      const arc = curConf.arc;
      const height = 9.5;

      // Geometría cilíndrica invertida para generar la pantalla cóncava IMAX
      const screenGeo = new THREE.CylinderGeometry(
        radius, radius, height, 48, 1, true,
        -arc / 2 + Math.PI / 2, arc
      );

      // Textura dinámica generada por Canvas que simula el contenido del navegador
      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');
      dibujarContenidoSimulado(ctx, canvas.width, canvas.height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const screenMat = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide
      });

      screenMesh = new THREE.Mesh(screenGeo, screenMat);
      actualizarTransformacionPantalla();
      scene.add(screenMesh);
    }

    function dibujarContenidoSimulado(ctx, w, h) {
      // Fondo degradado cine moderno
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#10121d');
      grad.addColorStop(0.5, '#1e1b4b');
      grad.addColorStop(1, '#090a10');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Barra superior simulada de Aurora Lite en el cine
      ctx.fillStyle = '#16161e';
      ctx.fillRect(0, 0, w, 70);

      ctx.fillStyle = '#7f5af0';
      ctx.beginPath();
      ctx.arc(45, 35, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fffffe';
      ctx.font = 'bold 24px -apple-system, sans-serif';
      ctx.fillText('Aurora Lite Cinema • ' + decodeURIComponent(mediaParam), 85, 43);

      // Marco de visualización central de video
      ctx.fillStyle = '#050508';
      ctx.fillRect(80, 110, w - 160, h - 200);

      // Efecto glow de reproductor
      ctx.strokeStyle = '#7f5af0';
      ctx.lineWidth = 4;
      ctx.strokeRect(80, 110, w - 160, h - 200);

      // Mensaje de reproducción
      ctx.fillStyle = '#fffffe';
      ctx.font = 'bold 44px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🎬 PANTALLA GIGANTE CURVA IMAX', w / 2, h / 2 - 40);

      ctx.font = '24px -apple-system, sans-serif';
      ctx.fillStyle = '#94a1b2';
      ctx.fillText('Fuente: ' + decodeURIComponent(mediaParam), w / 2, h / 2 + 15);
      ctx.fillText('Listo para visualización WebXR / Meta Quest 3S / PC VR', w / 2, h / 2 + 60);

      // Icono Play central
      ctx.fillStyle = '#7f5af0';
      ctx.beginPath();
      ctx.arc(w / 2, h / 2 + 150, 48, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(w / 2 - 12, h / 2 + 132);
      ctx.lineTo(w / 2 + 20, h / 2 + 150);
      ctx.lineTo(w / 2 - 12, h / 2 + 168);
      ctx.fill();
    }

    function actualizarTransformacionPantalla() {
      if (!screenMesh) return;
      const dist = state.distances[state.distanceIndex].z;
      const scale = state.scales[state.scaleIndex];
      screenMesh.position.set(0, 4.8, dist);
      screenMesh.scale.set(scale.sx, scale.sy, 1.0);
    }

    // Configuración de controles de cámara en PC (mouse / joystick)
    let isMouseDown = false;
    let mouseX = 0, mouseY = 0;
    let yaw = 0, pitch = 0;

    function configurarControlesDesktop() {
      window.addEventListener('mousedown', (e) => {
        if (e.target.closest('#theater-ui') || e.target.closest('#top-brand')) return;
        isMouseDown = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      window.addEventListener('mouseup', () => isMouseDown = false);

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown || renderer.xr.isPresenting) return;
        const deltaX = e.clientX - mouseX;
        const deltaY = e.clientY - mouseY;
        mouseX = e.clientX;
        mouseY = e.clientY;

        yaw -= deltaX * 0.003;
        pitch -= deltaY * 0.003;
        pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, pitch));

        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
      });
    }

    function configurarBotonesHUD() {
      // 1. Curvatura
      document.getElementById('btn-curve').addEventListener('click', () => {
        state.curvatureIndex = (state.curvatureIndex + 1) % state.curvatures.length;
        const cur = state.curvatures[state.curvatureIndex];
        document.getElementById('btn-curve').querySelector('span').textContent = `📐 Curvatura: ${cur.label}`;
        crearPantallaCurva();
      });

      // 2. Distancia
      document.getElementById('btn-distance').addEventListener('click', () => {
        state.distanceIndex = (state.distanceIndex + 1) % state.distances.length;
        const dist = state.distances[state.distanceIndex];
        document.getElementById('btn-distance').querySelector('span').textContent = `📏 Distancia: ${dist.label}`;
        actualizarTransformacionPantalla();
      });

      // 3. Escala
      document.getElementById('btn-scale').addEventListener('click', () => {
        state.scaleIndex = (state.scaleIndex + 1) % state.scales.length;
        const sc = state.scales[state.scaleIndex];
        document.getElementById('btn-scale').querySelector('span').textContent = `📺 Pantalla: ${sc.label}`;
        actualizarTransformacionPantalla();
      });

      // 4. Luces
      document.getElementById('btn-lights').addEventListener('click', () => {
        state.lightsIndex = (state.lightsIndex + 1) % state.lights.length;
        const li = state.lights[state.lightsIndex];
        document.getElementById('btn-lights').querySelector('span').textContent = `💡 Luces: ${li.label}`;
        ambientLight.intensity = li.intensity;
      });

      // 5. Cambiar URL
      document.getElementById('btn-url').addEventListener('click', () => {
        const nuevaUrl = prompt('Ingresa la URL del video o página web para proyectar en el cine:', 'https://www.youtube.com');
        if (nuevaUrl) {
          window.location.search = `?media=${encodeURIComponent(nuevaUrl)}&hz=${hzParam}`;
        }
      });

      // 5b. Modo Steam Link / PC Streaming
      document.getElementById('btn-steamlink').addEventListener('click', async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            mostrarToastHUD('Captura de pantalla no soportada en este visor. Ejecuta Steam Link desde tu PC.');
            return;
          }
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: 60, displaySurface: 'monitor' },
            audio: true
          });
          const video = document.createElement('video');
          video.srcObject = stream;
          video.muted = true;
          await video.play();

          const videoTexture = new THREE.VideoTexture(video);
          videoTexture.minFilter = THREE.LinearFilter;
          videoTexture.magFilter = THREE.LinearFilter;
          if (screenMesh) {
            screenMesh.material.map = videoTexture;
            screenMesh.material.needsUpdate = true;
          }
          const badge = document.getElementById('btn-steamlink');
          badge.style.borderColor = '#2cb67d';
          badge.querySelector('span').textContent = '🎮 Stream PC Activo';
        } catch (err) {
          console.warn('Captura cancelada o denegada:', err);
        }
      });

      // 5c. Modo SteamVR
      const btnSteamVR = document.getElementById('btn-steamvr');
      if (btnSteamVR) {
        btnSteamVR.addEventListener('click', () => {
          mostrarToastHUD('Conectando e iniciando entorno SteamVR...');
          window.location.href = 'steam://rungameid/250820';
        });
      }

      // 6. Botón WebXR (Meta Quest 3S)
      vrButton.addEventListener('click', async () => {
        if (!navigator.xr || !isVRSupported) {
          mostrarToastHUD('Conecta tu visor por Quest Link, Virtual Desktop o usa el visor nativo en Meta Quest 3S');
          return;
        }
        if (!renderer.xr.isPresenting) {
          try {
            const session = await navigator.xr.requestSession('immersive-vr', {
              optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
            });
            renderer.xr.setSession(session);
            vrButton.innerHTML = '<span>✕ Salir de VR</span>';
            session.addEventListener('end', () => {
              vrButton.innerHTML = '<span>🥽 Ingresar a VR (Quest 3S)</span>';
            });
          } catch (err) {
            console.warn('Error al iniciar WebXR session:', err);
            mostrarToastHUD('Conecta tu visor por Quest Link, Virtual Desktop o usa el visor nativo en Meta Quest 3S');
          }
        } else {
          renderer.xr.getSession()?.end();
        }
      });

      // 7. Salir
      document.getElementById('btn-exit').addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = decodeURIComponent(mediaParam);
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(time) {
      // Modulación sutil de iluminación reactiva simulada
      if (screenLight) {
        const pulse = Math.sin(time * 0.002) * 0.15;
        screenLight.intensity = 1.1 + pulse;
      }
      renderer.render(scene, camera);
    }

    // Exponer funciones globales para integración con WebEngine y SteamVR
    window.render = render;
    window.renderer = renderer;
    window.setRefreshRate = function(hz) {
      const ind = document.getElementById('hz-indicator');
      if (ind) ind.textContent = `${hz}Hz WebXR / SteamVR`;
    };

    // Inicializar
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
